<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GPS Camera Pro</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
      position: fixed;
    }
    #camera-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Top Controls */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10;
    }
    .gps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }
    .top-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
    }

    /* Bottom Stamp Dock */
    #stamp-card {
      position: absolute;
      bottom: 96px;
      left: 12px;
      right: 12px;
      background: rgba(15, 18, 24, 0.82);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .map-box {
      width: 88px;
      height: 88px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #222;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      color: #ff3b30;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .stamp-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      line-height: 1.35;
      color: #e0e0e0;
    }
    .stamp-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stamp-note {
      color: #a0a0a0;
      outline: none;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      display: inline-block;
      width: fit-content;
    }

    /* Bottom Shutter Bar */
    .shutter-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 86px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 10;
      padding-bottom: 8px;
    }
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s ease;
    }
    .shutter-btn:active .shutter-inner {
      transform: scale(0.9);
      background: #e0e0e0;
    }
    #hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="video" playsinline autoplay muted></video>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="gps-badge">
      <div class="pulse-dot"></div>
      <span id="gps-status">Locating GPS...</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-torch" title="Flash"><i data-lucide="zap-off"></i></button>
      <button class="icon-btn" id="btn-flip" title="Flip Camera"><i data-lucide="refresh-cw"></i></button>
    </div>
  </div>

  <!-- Real-time GPS Stamp Overlay -->
  <div id="stamp-card">
    <div class="map-box">
      <img id="map-img" src="" alt="Satellite Map" />
      <div class="map-pin">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
        </svg>
      </div>
    </div>
    <div class="stamp-text">
      <div class="stamp-title" id="txt-city">Locating... 🇮🇳</div>
      <div id="txt-sub">Waiting for satellite lock...</div>
      <div id="txt-coords">Lat 0.000000° Long 0.000000°</div>
      <div id="txt-time">--/--/---- --:-- --</div>
      <div class="stamp-note" id="txt-note" contenteditable="true" spellcheck="false">Note : Captured by GPS Camera Pro</div>
    </div>
  </div>

  <!-- Shutter Controls -->
  <div class="shutter-bar">
    <button class="icon-btn" id="btn-map-type" title="Toggle Map Style"><i data-lucide="globe"></i></button>
    <button class="shutter-btn" id="btn-shutter">
      <div class="shutter-inner"></div>
    </button>
    <div style="width: 40px;"></div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    lucide.createIcons();

    const video = document.getElementById('video');
    const canvas = document.getElementById('hidden-canvas');
    const mapImg = document.getElementById('map-img');
    const txtCity = document.getElementById('txt-city');
    const txtSub = document.getElementById('txt-sub');
    const txtCoords = document.getElementById('txt-coords');
    const txtTime = document.getElementById('txt-time');
    const txtNote = document.getElementById('txt-note');
    const gpsStatus = document.getElementById('gps-status');

    let currentStream = null;
    let track = null;
    let facingMode = "environment";
    let torchState = false;
    let currentLat = null;
    let currentLng = null;
    let currentAddress = "Detecting address...";
    let currentCity = "Locating...";
    let isSatellite = true;

    // 1. Clock Tracker
    function updateClock() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const day = days[now.getDay()];
      const pad = (n) => String(n).padStart(2, '0');
      const d = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      
      let hrs = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const t = `${pad(hrs)}:${pad(now.getMinutes())} ${ampm} GMT +05:30`;
      
      txtTime.textContent = `${day}, ${d} ${t}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Camera Management with Full HD & Torch
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        track = currentStream.getVideoTracks()[0];

        if (facingMode === "user") {
          video.classList.add('mirrored');
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        alert("Camera permission denied or camera not found: " + err.message);
      }
    }

    // Flip Camera
    document.getElementById('btn-flip').addEventListener('click', () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    // Toggle Torch
    document.getElementById('btn-torch').addEventListener('click', async () => {
      if (!track || facingMode === "user") return;
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      if (capabilities.torch) {
        torchState = !torchState;
        await track.applyConstraints({ advanced: [{ torch: torchState }] });
        const icon = document.querySelector('#btn-torch i');
        icon.setAttribute('data-lucide', torchState ? 'zap' : 'zap-off');
        lucide.createIcons();
      } else {
        alert("Flash/Torch not supported on this camera sensor.");
      }
    });

    // 3. High-Accuracy Geolocation & Satellite Tile Mapping
    function updateMapTile(lat, lng) {
      const zoom = 17;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lng + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
      
      // ESRI Satellite vs OSM Street
      if (isSatellite) {
        mapImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;
      } else {
        mapImg.src = `https://tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;
      }
    }

    document.getElementById('btn-map-type').addEventListener('click', () => {
      isSatellite = !isSatellite;
      if (currentLat && currentLng) updateMapTile(currentLat, currentLng);
    });

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        async (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);

          gpsStatus.textContent = `GPS: ±${acc}m`;
          txtCoords.textContent = `Lat ${currentLat.toFixed(6)}° Long ${currentLng.toFixed(6)}°`;
          updateMapTile(currentLat, currentLng);

          // Reverse Geocoding
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${currentLat}&lon=${currentLng}`);
            const data = await res.json();
            const a = data.address || {};
            
            const city = a.city || a.town || a.county || a.state_district || "Kurukshetra";
            const state = a.state || "Haryana";
            const country = a.country || "India";
            const road = a.road || a.suburb || a.residential || a.neighbourhood || "Sector 4";
            const postcode = a.postcode || "";

            currentCity = `${city}, ${state}, ${country} 🇮🇳`;
            currentAddress = `${road}, ${city} ${postcode}`.trim();

            txtCity.innerHTML = `${city}, ${state}, ${country} 🇮🇳`;
            txtSub.textContent = currentAddress;
          } catch (e) {
            txtCity.innerHTML = `Kurukshetra, Haryana, India 🇮🇳`;
            txtSub.textContent = `Lat: ${currentLat.toFixed(5)}, Long: ${currentLng.toFixed(5)}`;
          }
        },
        (err) => {
          gpsStatus.textContent = "GPS Unavailable";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 4. Stamped Capture Engine
    document.getElementById('btn-shutter').addEventListener('click', async () => {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // Draw camera frame (mirroring if front cam)
      ctx.save();
      if (facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      ctx.restore();

      // Build Stamped Overlay on Bottom
      const stampHeight = Math.round(canvas.height * 0.17);
      const stampY = canvas.height - stampHeight;

      // Card Background
      ctx.fillStyle = 'rgba(12, 16, 22, 0.85)';
      ctx.fillRect(0, stampY, canvas.width, stampHeight);

      // Top divider border
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(0, stampY, canvas.width, 2);

      // Draw Map Thumbnail
      const mapPadding = Math.round(stampHeight * 0.1);
      const mapSize = stampHeight - (mapPadding * 2);
      const mapX = mapPadding * 2;
      const mapDrawY = stampY + mapPadding;

      if (mapImg.complete && mapImg.naturalWidth !== 0) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(mapX, mapDrawY, mapSize, mapSize, 12);
        ctx.clip();
        ctx.drawImage(mapImg, mapX, mapDrawY, mapSize, mapSize);
        ctx.restore();

        // Map Border
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(mapX, mapDrawY, mapSize, mapSize);

        // Center Pin
        ctx.fillStyle = '#ff3b30';
        ctx.beginPath();
        ctx.arc(mapX + mapSize / 2, mapDrawY + mapSize / 2, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // Draw Typography
      const textX = mapX + mapSize + (mapPadding * 2);
      let textY = stampY + (stampHeight * 0.22);
      const fontSize = Math.round(stampHeight * 0.14);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${fontSize + 4}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillText(currentCity, textX, textY);

      ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillStyle = '#d0d0d0';
      textY += fontSize * 1.35;
      ctx.fillText(currentAddress, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtCoords.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtTime.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillStyle = '#9e9e9e';
      ctx.fillText(txtNote.textContent, textX, textY);

      // Auto Download
      const link = document.createElement('a');
      link.download = `GPS_Map_Photo_${Date.now()}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });

    startCamera();
  </script>
</body>
</html>
