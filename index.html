<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Camera Pro</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Top Controls Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 6px) + 6px) 12px 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    }
    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(15, 20, 26, 0.75);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff66;
    }
    .recording-timer {
      display: none;
      align-items: center;
      gap: 6px;
      color: #ff3b30;
      font-weight: 700;
      font-size: 12px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 20, 26, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Sticker Layout (Clean Edge Alignment) */
    .stamp-container {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 96px;
      z-index: 10;
      transition: bottom 0.2s ease, top 0.2s ease;
      max-width: 100%;
    }
    .stamp-container.pos-top {
      bottom: auto;
      top: calc(env(safe-area-inset-top, 6px) + 52px);
    }

    /* Landscape Mode: Keep Sticker Compact on the Left */
    @media (orientation: landscape) {
      .stamp-container {
        left: 12px;
        right: auto;
        bottom: 12px;
        width: 440px;
      }
      .stamp-container.pos-top {
        bottom: auto;
        top: 12px;
      }
    }

    #stamp-card {
      background: rgba(12, 16, 22, 0.88);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .map-box {
      width: 76px;
      height: 76px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #111;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      color: #ff3b30;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .stamp-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5px;
      font-size: 10.5px;
      line-height: 1.3;
      color: #e2e8f0;
      min-width: 0;
    }
    .stamp-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stamp-address {
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .stamp-custom-tag {
      color: #4cd964;
      font-weight: 600;
      outline: none;
      border-bottom: 1px dashed rgba(76, 217, 100, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      user-select: text;
    }
    .stamp-note {
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Bottom Bar */
    .bottom-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 0 16px calc(env(safe-area-inset-bottom, 8px) + 8px) 16px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
    }
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .mode-btn {
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      padding: 2px 4px;
    }
    .mode-btn.active {
      color: #ffd60a;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s ease, border-radius 0.2s ease, background-color 0.2s ease;
    }
    .shutter-btn.video-mode .shutter-inner {
      background: #ff3b30;
    }
    .shutter-btn.recording .shutter-inner {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #ff3b30;
      animation: pulseRecord 1s infinite alternate;
    }
    @keyframes pulseRecord {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    #hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="viewport">
      <video id="camera-feed" playsinline autoplay muted></video>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="gps-pill">
        <div class="pulse-dot"></div>
        <span id="gps-status">GPS: Searching...</span>
      </div>
      <div class="recording-timer" id="record-timer">
        <span>● REC</span>
        <span id="timer-val">00:00</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-torch" title="Flash">
          <svg id="svg-torch" viewBox="0 0 24 24">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
            <path d="M18.57 12.91 21 10h-5.34"></path>
            <path d="M8 8l-5 6h9l-1 8 5-6"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-flip" title="Flip Camera">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Floating Stamp Card -->
    <div class="stamp-container" id="stamp-container">
      <div id="stamp-card">
        <div class="map-box">
          <img id="map-img" crossorigin="anonymous" alt="Satellite Tile" />
          <div class="map-pin">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff3b30">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
          </div>
        </div>
        <div class="stamp-text">
          <div class="stamp-title" id="txt-city">Thanesar, Haryana, India 🇮🇳</div>
          <div class="stamp-address" id="txt-sub">Locating address...</div>
          <div class="stamp-custom-tag" id="txt-tag" contenteditable="true" spellcheck="false" title="Tap to name Mill or Road">🏷️ Site: Aggarwal Rice Mill</div>
          <div id="txt-coords">Lat 0.000000° Long 0.000000°</div>
          <div id="txt-time">--/--/---- --:-- --</div>
          <div class="stamp-note" id="txt-note">Note: Captured by GPS Camera Pro</div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-section">
      <div class="mode-selector">
        <span class="mode-btn active" id="mode-photo">PHOTO</span>
        <span class="mode-btn" id="mode-video">VIDEO</span>
      </div>

      <div class="bottom-bar">
        <!-- Stamp Compact / Full View Toggle -->
        <button class="icon-btn" id="btn-size-toggle" title="Toggle Detail View">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="12" x2="21" y2="12"></line>
          </svg>
        </button>

        <!-- Shutter Button -->
        <button class="shutter-btn" id="btn-shutter" title="Shutter">
          <div class="shutter-inner"></div>
        </button>

        <!-- 2-Tap Position Switcher (Bottom <-> Top) -->
        <button class="icon-btn" id="btn-pos" title="Move Sticker Top/Bottom">
          <svg viewBox="0 0 24 24">
            <polyline points="7 11 12 6 17 11"></polyline>
            <polyline points="17 13 12 18 7 13"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('hidden-canvas');
    const mapImg = document.getElementById('map-img');
    const txtCity = document.getElementById('txt-city');
    const txtSub = document.getElementById('txt-sub');
    const txtTag = document.getElementById('txt-tag');
    const txtCoords = document.getElementById('txt-coords');
    const txtTime = document.getElementById('txt-time');
    const gpsStatus = document.getElementById('gps-status');
    const svgTorch = document.getElementById('svg-torch');
    const stampContainer = document.getElementById('stamp-container');
    const btnShutter = document.getElementById('btn-shutter');
    const modePhoto = document.getElementById('mode-photo');
    const modeVideo = document.getElementById('mode-video');
    const recordTimer = document.getElementById('record-timer');
    const timerVal = document.getElementById('timer-val');

    let currentStream = null;
    let track = null;
    let facingMode = "environment";
    let torchState = false;
    let currentLat = null;
    let currentLng = null;
    let isAtTop = false;

    let currentMode = "photo";
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordInterval = null;
    let recordSeconds = 0;
    let videoRenderLoop = false;

    const iconZapOn = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffd60a"></polygon>`;
    const iconZapOff = `
      <line x1="2" y1="2" x2="22" y2="22"></line>
      <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
      <path d="M18.57 12.91 21 10h-5.34"></path>
      <path d="M8 8l-5 6h9l-1 8 5-6"></path>
    `;

    // 1. Clock Tracker
    function updateClock() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const pad = (n) => String(n).padStart(2, '0');
      const d = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      
      let hrs = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const t = `${pad(hrs)}:${pad(now.getMinutes())} ${ampm} GMT +05:30`;
      
      txtTime.textContent = `${days[now.getDay()]}, ${d} ${t}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Camera Stream Setup
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: true
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        track = currentStream.getVideoTracks()[0];

        if (facingMode === "user") {
          video.classList.add('mirrored');
          torchState = false;
          svgTorch.innerHTML = iconZapOff;
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode } } });
          video.srcObject = currentStream;
          track = currentStream.getVideoTracks()[0];
        } catch (e) {
          console.error("Camera fail", e);
        }
      }
    }

    document.getElementById('btn-flip').addEventListener('click', () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    document.getElementById('btn-torch').addEventListener('click', async () => {
      if (!track || facingMode === "user") return;
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) {
          torchState = !torchState;
          await track.applyConstraints({ advanced: [{ torch: torchState }] });
          svgTorch.innerHTML = torchState ? iconZapOn : iconZapOff;
        }
      } catch (e) {}
    });

    // 2-Tap Position Switcher (Top <-> Bottom)
    document.getElementById('btn-pos').addEventListener('click', () => {
      isAtTop = !isAtTop;
      if (isAtTop) {
        stampContainer.classList.add('pos-top');
      } else {
        stampContainer.classList.remove('pos-top');
      }
    });

    // Size Toggle (Full vs Compact view)
    let isCompact = false;
    document.getElementById('btn-size-toggle').addEventListener('click', () => {
      isCompact = !isCompact;
      txtSub.style.display = isCompact ? 'none' : 'block';
      txtCoords.style.display = isCompact ? 'none' : 'block';
    });

    // 3. High-Res Satellite Tiles
    function updateSatelliteTile(lat, lng) {
      const zoom = 17;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lng + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);

      mapImg.crossOrigin = "anonymous";
      mapImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;
    }

    // 4. Geolocation Engine
    async function reverseGeocode(lat, lng) {
      try {
        const bdc = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
        const b = await bdc.json();
        const city = b.city || b.locality || "Thanesar";
        const state = b.principalSubdivision || "Haryana";
        const road = b.localityInfo?.informative?.[0]?.name ? `${b.localityInfo.informative[0].name}, ` : "";
        const street = b.locality || "Sector 4";
        const post = b.postcode ? `, ${b.postcode}` : "";

        txtCity.textContent = `${city}, ${state}, India 🇮🇳`;
        txtSub.textContent = `${road}${street}${post}`;
      } catch (e) {}
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          gpsStatus.textContent = `GPS: ±${Math.round(pos.coords.accuracy)}m`;
          txtCoords.textContent = `Lat ${currentLat.toFixed(6)}° Long ${currentLng.toFixed(6)}°`;
          updateSatelliteTile(currentLat, currentLng);
          reverseGeocode(currentLat, currentLng);
        },
        () => { gpsStatus.textContent = "GPS Unavailable"; },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 5. Mode Switcher
    modePhoto.addEventListener('click', () => {
      if (isRecording) return;
      currentMode = "photo";
      modePhoto.classList.add('active');
      modeVideo.classList.remove('active');
      btnShutter.classList.remove('video-mode');
    });

    modeVideo.addEventListener('click', () => {
      currentMode = "video";
      modeVideo.classList.add('active');
      modePhoto.classList.remove('active');
      btnShutter.classList.add('video-mode');
    });

    btnShutter.addEventListener('click', () => {
      if (currentMode === "photo") {
        capturePhoto();
      } else {
        toggleVideoRecording();
      }
    });

    // 6. Universal Stamped Frame Renderer (Used by Photo & Video)
    function drawStampedFrame(targetCanvas) {
      const ctx = targetCanvas.getContext('2d');
      const w = targetCanvas.width;
      const h = targetCanvas.height;

      // Draw camera image
      ctx.save();
      if (facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -w, 0, w, h);
      } else {
        ctx.drawImage(video, 0, 0, w, h);
      }
      ctx.restore();

      const isLandscape = w > h;

      // Dimensions & Positioning
      let cardX, cardY, cardWidth, cardHeight;
      const cornerRadius = 18;

      if (isLandscape) {
        // Landscape: Compact Card pinned on Bottom-Left or Top-Left
        cardWidth = Math.min(Math.round(w * 0.52), 620);
        cardHeight = Math.round(h * 0.28);
        cardX = Math.round(w * 0.02);
        cardY = isAtTop ? Math.round(h * 0.03) : (h - cardHeight - Math.round(h * 0.03));
      } else {
        // Portrait: Anchored cleanly from edges
        const margin = Math.round(w * 0.02);
        cardX = margin;
        cardWidth = w - (margin * 2);
        cardHeight = Math.round(h * 0.17);
        cardY = isAtTop ? margin : (h - cardHeight - margin);
      }

      // Draw Translucent Rounded Card
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(cardX, cardY, cardWidth, cardHeight, cornerRadius);
      } else {
        ctx.rect(cardX, cardY, cardWidth, cardHeight);
      }
      ctx.fillStyle = 'rgba(10, 14, 20, 0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.clip();

      // Render Rounded Map Thumbnail
      const mapPadding = Math.round(cardHeight * 0.09);
      const mapSize = cardHeight - (mapPadding * 2);
      const mapX = cardX + mapPadding;
      const mapY = cardY + mapPadding;

      try {
        if (mapImg.complete && mapImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(mapX, mapY, mapSize, mapSize, 12);
          else ctx.rect(mapX, mapY, mapSize, mapSize);
          ctx.clip();
          ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);
          ctx.restore();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(mapX, mapY, mapSize, mapSize);

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(mapX + mapSize / 2, mapY + mapSize / 2, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      } catch (e) {}

      // Calculate Typography Positions (Fully bounded)
      const textX = mapX + mapSize + (mapPadding * 1.4);
      const maxTextWidth = cardX + cardWidth - textX - mapPadding;
      const lineStep = cardHeight / 6.4;
      let textY = cardY + (lineStep * 1.1);
      const fontSize = Math.round(lineStep * 0.72);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${fontSize + 2}px sans-serif`;
      ctx.fillText(txtCity.textContent, textX, textY, maxTextWidth);

      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = '#cbd5e1';
      textY += lineStep;
      ctx.fillText(txtSub.textContent, textX, textY, maxTextWidth);

      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillStyle = '#4cd964';
      textY += lineStep;
      ctx.fillText(txtTag.textContent, textX, textY, maxTextWidth);

      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = '#cbd5e1';
      textY += lineStep;
      ctx.fillText(txtCoords.textContent, textX, textY, maxTextWidth);

      textY += lineStep;
      ctx.fillText(txtTime.textContent, textX, textY, maxTextWidth);

      ctx.fillStyle = '#94a3b8';
      textY += lineStep;
      ctx.fillText("Note: Captured by GPS Camera Pro", textX, textY, maxTextWidth);

      ctx.restore();
    }

    // Photo Capture
    function capturePhoto() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      drawStampedFrame(canvas);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement('a');
        link.download = `GPS_Photo_${Date.now()}.jpg`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/jpeg', 0.95);
    }

    // Video Recording with Stamped Watermark
    function toggleVideoRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      if (!video.videoWidth) return;
      recordedChunks = [];

      // Recording resolution (standardized for steady 30fps)
      const isLandscape = video.videoWidth > video.videoHeight;
      const recCanvas = document.createElement('canvas');
      recCanvas.width = isLandscape ? 1280 : 720;
      recCanvas.height = isLandscape ? 720 : 1280;

      const stream = recCanvas.captureStream(30);

      if (currentStream && currentStream.getAudioTracks().length > 0) {
        stream.addTrack(currentStream.getAudioTracks()[0]);
      }

      videoRenderLoop = true;
      function renderLoop() {
        if (!videoRenderLoop) return;
        drawStampedFrame(recCanvas);
        requestAnimationFrame(renderLoop);
      }
      requestAnimationFrame(renderLoop);

      try {
        const options = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
          ? { mimeType: 'video/mp4;codecs=avc1' }
          : { mimeType: 'video/webm;codecs=vp8' };

        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        videoRenderLoop = false;
        const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
        const link = document.createElement('a');
        link.download = `GPS_Video_${Date.now()}.${ext}`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      };

      mediaRecorder.start();
      isRecording = true;
      btnShutter.classList.add('recording');
      recordTimer.style.display = 'flex';
      recordSeconds = 0;
      recordInterval = setInterval(() => {
        recordSeconds++;
        const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
        const s = String(recordSeconds % 60).padStart(2, '0');
        timerVal.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnShutter.classList.remove('recording');
        recordTimer.style.display = 'none';
        clearInterval(recordInterval);
      }
    }

    startCamera();
  </script>
</body>
