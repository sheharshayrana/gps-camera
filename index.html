<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GPS Camera Pro</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* Screen Wrapper */
    .app-viewport {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }
    .top-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      padding: 0;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Lower Section: Stamp + Shutter Bar */
    .bottom-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 12px);
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
    }

    /* Stamp Overlay */
    #stamp-card {
      margin: 0 12px;
      background: rgba(18, 22, 28, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .map-box {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #111;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      color: #ff3b30;
      pointer-events: none;
    }
    .stamp-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      line-height: 1.35;
      color: #e5e5e5;
      min-width: 0;
    }
    .stamp-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stamp-note {
      color: #a0a0a0;
      outline: none;
      border-bottom: 1px dashed rgba(255,255,255,0.25);
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Shutter Bar */
    .shutter-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 20px 6px 20px;
    }
    .shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.08s ease;
    }
    .shutter-btn:active .shutter-inner {
      transform: scale(0.9);
      background: #ddd;
    }
    #hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <video id="camera-feed" playsinline autoplay muted></video>

    <!-- Top Bar Controls -->
    <div class="top-bar">
      <div class="gps-pill">
        <div class="pulse-dot"></div>
        <span id="gps-status">GPS: Searching...</span>
      </div>
      <div class="top-actions">
        <!-- Torch Button with Inline SVG -->
        <button class="icon-btn" id="btn-torch" title="Flash">
          <svg id="svg-torch" viewBox="0 0 24 24">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
            <path d="M18.57 12.91 21 10h-5.34"></path>
            <path d="M8 8l-5 6h9l-1 8 5-6"></path>
          </svg>
        </button>
        <!-- Camera Flip Button -->
        <button class="icon-btn" id="btn-flip" title="Flip Camera">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Bottom Controls Area -->
    <div class="bottom-section">
      <!-- Stamp View -->
      <div id="stamp-card">
        <div class="map-box">
          <img id="map-img" crossorigin="anonymous" alt="Map View" />
          <div class="map-pin">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff3b30">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
          </div>
        </div>
        <div class="stamp-text">
          <div class="stamp-title" id="txt-city">Locating... 🇮🇳</div>
          <div id="txt-sub">Detecting address...</div>
          <div id="txt-coords">Lat 0.000000° Long 0.000000°</div>
          <div id="txt-time">--/--/---- --:-- --</div>
          <div class="stamp-note" id="txt-note" contenteditable="true" spellcheck="false">Note : Captured by GPS Camera Pro</div>
        </div>
      </div>

      <!-- Shutter Row -->
      <div class="shutter-bar">
        <button class="icon-btn" id="btn-map-type" title="Switch Map View">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>
        <button class="shutter-btn" id="btn-shutter">
          <div class="shutter-inner"></div>
        </button>
        <div style="width: 42px;"></div>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('hidden-canvas');
    const mapImg = document.getElementById('map-img');
    const txtCity = document.getElementById('txt-city');
    const txtSub = document.getElementById('txt-sub');
    const txtCoords = document.getElementById('txt-coords');
    const txtTime = document.getElementById('txt-time');
    const txtNote = document.getElementById('txt-note');
    const gpsStatus = document.getElementById('gps-status');
    const svgTorch = document.getElementById('svg-torch');

    let currentStream = null;
    let track = null;
    let facingMode = "environment";
    let torchState = false;
    let currentLat = null;
    let currentLng = null;
    let currentAddress = "Detecting address...";
    let currentCity = "Kurukshetra, Haryana, India 🇮🇳";
    let isSatellite = true;

    // SVG icon templates
    const iconZapOn = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor"></polygon>`;
    const iconZapOff = `
      <line x1="2" y1="2" x2="22" y2="22"></line>
      <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
      <path d="M18.57 12.91 21 10h-5.34"></path>
      <path d="M8 8l-5 6h9l-1 8 5-6"></path>
    `;

    // 1. Clock Tracker
    function updateClock() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const day = days[now.getDay()];
      const pad = (n) => String(n).padStart(2, '0');
      const d = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      
      let hrs = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const t = `${pad(hrs)}:${pad(now.getMinutes())} ${ampm} GMT +05:30`;
      
      txtTime.textContent = `${day}, ${d} ${t}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Camera Management
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        track = currentStream.getVideoTracks()[0];

        if (facingMode === "user") {
          video.classList.add('mirrored');
          torchState = false;
          svgTorch.innerHTML = iconZapOff;
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        console.error("Camera access error:", err);
      }
    }

    // Flip Camera
    document.getElementById('btn-flip').addEventListener('click', () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    // Toggle Torch
    document.getElementById('btn-torch').addEventListener('click', async () => {
      if (!track || facingMode === "user") return;
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          torchState = !torchState;
          await track.applyConstraints({ advanced: [{ torch: torchState }] });
          svgTorch.innerHTML = torchState ? iconZapOn : iconZapOff;
        }
      } catch (e) {
        console.warn("Torch constraint not applied", e);
      }
    });

    // 3. Tile Generation (CORS Enabled)
    function updateMapTile(lat, lng) {
      const zoom = 17;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lng + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);

      mapImg.crossOrigin = "anonymous";
      if (isSatellite) {
        mapImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;
      } else {
        mapImg.src = `https://tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;
      }
    }

    document.getElementById('btn-map-type').addEventListener('click', () => {
      isSatellite = !isSatellite;
      if (currentLat && currentLng) updateMapTile(currentLat, currentLng);
    });

    // Geolocation Watcher
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        async (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);

          gpsStatus.textContent = `GPS: ±${acc}m`;
          txtCoords.textContent = `Lat ${currentLat.toFixed(6)}° Long ${currentLng.toFixed(6)}°`;
          updateMapTile(currentLat, currentLng);

          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${currentLat}&lon=${currentLng}`);
            const data = await res.json();
            const a = data.address || {};
            
            const city = a.city || a.town || a.county || a.state_district || "Kurukshetra";
            const state = a.state || "Haryana";
            const country = a.country || "India";
            const road = a.road || a.suburb || a.residential || a.neighbourhood || "Sector 4";
            const postcode = a.postcode || "";

            currentCity = `${city}, ${state}, ${country} 🇮🇳`;
            currentAddress = `${road}, ${city} ${postcode}`.trim();

            txtCity.innerHTML = currentCity;
            txtSub.textContent = currentAddress;
          } catch (e) {
            txtCity.innerHTML = `Kurukshetra, Haryana, India 🇮🇳`;
            txtSub.textContent = `Lat: ${currentLat.toFixed(5)}, Long: ${currentLng.toFixed(5)}`;
          }
        },
        () => {
          gpsStatus.textContent = "GPS Offline";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 4. Stamped Capture Engine
    document.getElementById('btn-shutter').addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // Draw camera sensor frame
      ctx.save();
      if (facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      ctx.restore();

      // Build Edge-to-Edge Stamp at Bottom
      const stampHeight = Math.round(canvas.height * 0.16);
      const stampY = canvas.height - stampHeight;

      // Dark translucent backdrop
      ctx.fillStyle = 'rgba(12, 16, 22, 0.88)';
      ctx.fillRect(0, stampY, canvas.width, stampHeight);

      // Top divider accent line
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect(0, stampY, canvas.width, 2);

      // Render Map Tile
      const mapPadding = Math.round(stampHeight * 0.1);
      const mapSize = stampHeight - (mapPadding * 2);
      const mapX = mapPadding * 2;
      const mapDrawY = stampY + mapPadding;

      try {
        if (mapImg.complete && mapImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(mapX, mapDrawY, mapSize, mapSize, 8);
          } else {
            ctx.rect(mapX, mapDrawY, mapSize, mapSize);
          }
          ctx.clip();
          ctx.drawImage(mapImg, mapX, mapDrawY, mapSize, mapSize);
          ctx.restore();

          // Border & Pin
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 2;
          ctx.strokeRect(mapX, mapDrawY, mapSize, mapSize);

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(mapX + mapSize / 2, mapDrawY + mapSize / 2, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      } catch (corsErr) {
        console.warn("Map image skipped in canvas due to cross-origin restriction.");
      }

      // Draw Information Texts
      const textX = mapX + mapSize + (mapPadding * 2);
      let textY = stampY + (stampHeight * 0.22);
      const fontSize = Math.round(stampHeight * 0.13);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${fontSize + 4}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillText(currentCity, textX, textY);

      ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillStyle = '#dcdcdc';
      textY += fontSize * 1.35;
      ctx.fillText(currentAddress, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtCoords.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtTime.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillStyle = '#a0a0a0';
      ctx.fillText(txtNote.textContent, textX, textY);

      // Trigger Instant Image Download / Save
      canvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement('a');
        link.download = `GPS_Map_Photo_${Date.now()}.jpg`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/jpeg', 0.95);
    });

    startCamera();
  </script>
</body>
</html>
