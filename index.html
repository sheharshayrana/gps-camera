<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Camera Pro</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Live Viewfinder */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video.ratio-4-3 {
      height: auto;
      aspect-ratio: 3/4;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Top Controls Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 8px) + 8px) 14px 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
    }
    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(18, 22, 28, 0.7);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }
    .recording-timer {
      display: none;
      align-items: center;
      gap: 6px;
      color: #ff3b30;
      font-weight: 700;
      font-size: 13px;
    }
    .top-actions {
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(18, 22, 28, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Stamp Card (Strict 2-Tap Position: Bottom or Top) */
    .stamp-container {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 112px;
      z-index: 10;
      transition: bottom 0.25s ease, top 0.25s ease;
    }
    .stamp-container.pos-top {
      bottom: auto;
      top: calc(env(safe-area-inset-top, 8px) + 58px);
    }

    #stamp-card {
      background: rgba(12, 16, 22, 0.88);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .map-box {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #151515;
      border: 1px solid rgba(255,255,255,0.22);
    }
    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      color: #ff3b30;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .stamp-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      line-height: 1.34;
      color: #e2e8f0;
      min-width: 0;
    }
    .stamp-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stamp-address {
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    /* Dedicated Editable Site Tag */
    .stamp-custom-tag {
      color: #4cd964;
      font-weight: 600;
      outline: none;
      border-bottom: 1px dashed rgba(76, 217, 100, 0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      user-select: text;
    }
    .stamp-note {
      color: #94a3b8;
      outline: none;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      user-select: text;
    }

    /* Mode Selector (Photo / Video) */
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .mode-btn {
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      padding: 2px 6px;
      transition: color 0.15s ease;
    }
    .mode-btn.active {
      color: #ffd60a;
    }

    /* Bottom Control Bar */
    .bottom-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 0 20px calc(env(safe-area-inset-bottom, 12px) + 8px) 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
    }
    .bottom-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s ease, border-radius 0.2s ease, background-color 0.2s ease;
    }
    .shutter-btn.video-mode .shutter-inner {
      background: #ff3b30;
    }
    .shutter-btn.recording .shutter-inner {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #ff3b30;
      animation: pulseRecord 1s infinite alternate;
    }
    @keyframes pulseRecord {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    #hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="viewport">
      <video id="camera-feed" playsinline autoplay muted></video>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="gps-pill">
        <div class="pulse-dot" id="gps-dot"></div>
        <span id="gps-status">GPS: Searching...</span>
      </div>
      <div class="recording-timer" id="record-timer">
        <span>● REC</span>
        <span id="timer-val">00:00</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-torch" title="Flash">
          <svg id="svg-torch" viewBox="0 0 24 24">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
            <path d="M18.57 12.91 21 10h-5.34"></path>
            <path d="M8 8l-5 6h9l-1 8 5-6"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-flip" title="Flip Camera">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-ratio" title="Aspect Ratio">4:3</button>
      </div>
    </div>

    <!-- Clean Stamp Card -->
    <div class="stamp-container" id="stamp-container">
      <div id="stamp-card">
        <div class="map-box">
          <img id="map-img" crossorigin="anonymous" alt="Satellite Tile" />
          <div class="map-pin">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff3b30">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
          </div>
        </div>
        <div class="stamp-text">
          <div class="stamp-title" id="txt-city">Thanesar, Haryana, India 🇮🇳</div>
          <div class="stamp-address" id="txt-sub">Locating address...</div>
          <!-- New Dedicated Site/Mill Name Line -->
          <div class="stamp-custom-tag" id="txt-tag" contenteditable="true" spellcheck="false" title="Tap to type Mill or Road name">🏷️ Site: Aggarwal Rice Mill</div>
          <div id="txt-coords">Lat 0.000000° Long 0.000000°</div>
          <div id="txt-time">--/--/---- --:-- --</div>
          <div class="stamp-note" id="txt-note" contenteditable="true" spellcheck="false">Note: Captured by GPS Camera Pro</div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls & Shutter -->
    <div class="bottom-section">
      <!-- Mode Toggle: PHOTO or VIDEO -->
      <div class="mode-selector">
        <span class="mode-btn active" id="mode-photo">PHOTO</span>
        <span class="mode-btn" id="mode-video">VIDEO</span>
      </div>

      <div class="bottom-bar">
        <!-- Satellite / Map View -->
        <button class="icon-btn" id="btn-map-type" title="Map Style">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>

        <!-- Shutter (Photo Click / Video Record) -->
        <button class="shutter-btn" id="btn-shutter" title="Shutter">
          <div class="shutter-inner"></div>
        </button>

        <!-- 2-Tap Position Switcher (Bottom <-> Top) -->
        <button class="icon-btn" id="btn-pos" title="Move Sticker Top/Bottom">
          <svg viewBox="0 0 24 24">
            <polyline points="7 11 12 6 17 11"></polyline>
            <polyline points="17 13 12 18 7 13"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('hidden-canvas');
    const mapImg = document.getElementById('map-img');
    const txtCity = document.getElementById('txt-city');
    const txtSub = document.getElementById('txt-sub');
    const txtTag = document.getElementById('txt-tag');
    const txtCoords = document.getElementById('txt-coords');
    const txtTime = document.getElementById('txt-time');
    const txtNote = document.getElementById('txt-note');
    const gpsStatus = document.getElementById('gps-status');
    const svgTorch = document.getElementById('svg-torch');
    const stampContainer = document.getElementById('stamp-container');
    const btnShutter = document.getElementById('btn-shutter');
    const modePhoto = document.getElementById('mode-photo');
    const modeVideo = document.getElementById('mode-video');
    const recordTimer = document.getElementById('record-timer');
    const timerVal = document.getElementById('timer-val');

    let currentStream = null;
    let track = null;
    let facingMode = "environment";
    let torchState = false;
    let currentLat = null;
    let currentLng = null;
    let isSatellite = true;
    let isFullRatio = false;
    let isAtTop = false; // Strict 2-Tap state

    let currentMode = "photo"; // "photo" | "video"
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordInterval = null;
    let recordSeconds = 0;

    const iconZapOn = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffd60a"></polygon>`;
    const iconZapOff = `
      <line x1="2" y1="2" x2="22" y2="22"></line>
      <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
      <path d="M18.57 12.91 21 10h-5.34"></path>
      <path d="M8 8l-5 6h9l-1 8 5-6"></path>
    `;

    // 1. Clock Tracker
    function updateClock() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const pad = (n) => String(n).padStart(2, '0');
      const d = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      
      let hrs = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const t = `${pad(hrs)}:${pad(now.getMinutes())} ${ampm} GMT +05:30`;
      
      txtTime.textContent = `${days[now.getDay()]}, ${d} ${t}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Camera Stream
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: true // Enabled for video recording
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        track = currentStream.getVideoTracks()[0];

        if (facingMode === "user") {
          video.classList.add('mirrored');
          torchState = false;
          svgTorch.innerHTML = iconZapOff;
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        // Fallback without audio if mic rejected
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode } } });
          video.srcObject = currentStream;
          track = currentStream.getVideoTracks()[0];
        } catch (e) {
          console.error("Camera fail", e);
        }
      }
    }

    document.getElementById('btn-flip').addEventListener('click', () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    document.getElementById('btn-torch').addEventListener('click', async () => {
      if (!track || facingMode === "user") return;
      try {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) {
          torchState = !torchState;
          await track.applyConstraints({ advanced: [{ torch: torchState }] });
          svgTorch.innerHTML = torchState ? iconZapOn : iconZapOff;
        }
      } catch (e) {}
    });

    const btnRatio = document.getElementById('btn-ratio');
    btnRatio.addEventListener('click', () => {
      isFullRatio = !isFullRatio;
      if (isFullRatio) {
        video.classList.remove('ratio-4-3');
        btnRatio.textContent = "Full";
      } else {
        video.classList.add('ratio-4-3');
        btnRatio.textContent = "4:3";
      }
    });

    // 3. Strict 2-Tap Position Switcher
    document.getElementById('btn-pos').addEventListener('click', () => {
      isAtTop = !isAtTop;
      if (isAtTop) {
        stampContainer.classList.add('pos-top');
      } else {
        stampContainer.classList.remove('pos-top');
      }
    });

    // 4. Map Tiles
    function updateMapTile(lat, lng) {
      const zoom = 17;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lng + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);

      mapImg.crossOrigin = "anonymous";
      mapImg.src = isSatellite
        ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`
        : `https://tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;
    }

    document.getElementById('btn-map-type').addEventListener('click', () => {
      isSatellite = !isSatellite;
      if (currentLat && currentLng) updateMapTile(currentLat, currentLng);
    });

    // 5. High Accuracy Location Lock
    async function reverseGeocode(lat, lng) {
      try {
        const bdc = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
        const b = await bdc.json();
        const city = b.city || b.locality || "Thanesar";
        const state = b.principalSubdivision || "Haryana";
        const road = b.localityInfo?.informative?.[0]?.name ? `${b.localityInfo.informative[0].name}, ` : "";
        const street = b.locality || "Sector 4";
        const post = b.postcode ? `, ${b.postcode}` : "";

        txtCity.textContent = `${city}, ${state}, India 🇮🇳`;
        txtSub.textContent = `${road}${street}${post}`;
      } catch (e) {}
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          gpsStatus.textContent = `GPS: ±${Math.round(pos.coords.accuracy)}m`;
          txtCoords.textContent = `Lat ${currentLat.toFixed(6)}° Long ${currentLng.toFixed(6)}°`;
          updateMapTile(currentLat, currentLng);
          reverseGeocode(currentLat, currentLng);
        },
        () => { gpsStatus.textContent = "GPS Unavailable"; },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 6. Mode Switcher (PHOTO / VIDEO)
    modePhoto.addEventListener('click', () => {
      if (isRecording) return;
      currentMode = "photo";
      modePhoto.classList.add('active');
      modeVideo.classList.remove('active');
      btnShutter.classList.remove('video-mode');
    });

    modeVideo.addEventListener('click', () => {
      currentMode = "video";
      modeVideo.classList.add('active');
      modePhoto.classList.remove('active');
      btnShutter.classList.add('video-mode');
    });

    // 7. Shutter Handler (Photo Capture OR Video Record)
    btnShutter.addEventListener('click', () => {
      if (currentMode === "photo") {
        capturePhoto();
      } else {
        toggleVideoRecording();
      }
    });

    function drawStampedFrame(targetCanvas) {
      targetCanvas.width = video.videoWidth;
      targetCanvas.height = video.videoHeight;
      const ctx = targetCanvas.getContext('2d');

      // 1. Draw Camera Feed
      ctx.save();
      if (facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -targetCanvas.width, 0, targetCanvas.width, targetCanvas.height);
      } else {
        ctx.drawImage(video, 0, 0, targetCanvas.width, targetCanvas.height);
      }
      ctx.restore();

      // 2. Responsive Stamp (adapts to Portrait or Landscape)
      const isLandscape = targetCanvas.width > targetCanvas.height;
      const stampHeight = isLandscape ? Math.round(targetCanvas.height * 0.22) : Math.round(targetCanvas.height * 0.17);
      const stampY = isAtTop ? 0 : (targetCanvas.height - stampHeight);

      // Card Backdrop
      ctx.fillStyle = 'rgba(10, 14, 20, 0.88)';
      ctx.fillRect(0, stampY, targetCanvas.width, stampHeight);

      // Divider Line
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      const lineY = isAtTop ? stampHeight : stampY;
      ctx.fillRect(0, lineY, targetCanvas.width, 2);

      // Render Map Thumbnail
      const mapPadding = Math.round(stampHeight * 0.08);
      const mapSize = stampHeight - (mapPadding * 2);
      const mapX = mapPadding * 2;
      const mapDrawY = stampY + mapPadding;

      try {
        if (mapImg.complete && mapImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(mapX, mapDrawY, mapSize, mapSize, 8);
          else ctx.rect(mapX, mapDrawY, mapSize, mapSize);
          ctx.clip();
          ctx.drawImage(mapImg, mapX, mapDrawY, mapSize, mapSize);
          ctx.restore();

          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 2;
          ctx.strokeRect(mapX, mapDrawY, mapSize, mapSize);

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(mapX + mapSize / 2, mapDrawY + mapSize / 2, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      } catch (e) {}

      // Draw Clamped Text Elements (Won't overflow)
      const textX = mapX + mapSize + (mapPadding * 2);
      const maxTextWidth = targetCanvas.width - textX - (mapPadding * 2);
      let textY = stampY + (stampHeight * 0.20);
      const fontSize = isLandscape ? Math.round(stampHeight * 0.13) : Math.round(stampHeight * 0.12);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${fontSize + 3}px sans-serif`;
      ctx.fillText(txtCity.textContent, textX, textY, maxTextWidth);

      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = '#cbd5e1';
      textY += fontSize * 1.30;
      ctx.fillText(txtSub.textContent, textX, textY, maxTextWidth);

      // Render Site / Mill Name Tag
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillStyle = '#4cd964';
      textY += fontSize * 1.30;
      ctx.fillText(txtTag.textContent, textX, textY, maxTextWidth);

      // Coordinates & Time
      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = '#cbd5e1';
      textY += fontSize * 1.30;
      ctx.fillText(txtCoords.textContent, textX, textY, maxTextWidth);

      textY += fontSize * 1.30;
      ctx.fillText(txtTime.textContent, textX, textY, maxTextWidth);

      ctx.fillStyle = '#94a3b8';
      textY += fontSize * 1.30;
      ctx.fillText(txtNote.textContent, textX, textY, maxTextWidth);
    }

    function capturePhoto() {
      if (!video.videoWidth) return;
      drawStampedFrame(canvas);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement('a');
        link.download = `GPS_Photo_${Date.now()}.jpg`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/jpeg', 0.95);
    }

    // Video Recording with Live Render
    function toggleVideoRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const renderCanvas = document.createElement('canvas');
      renderCanvas.width = video.videoWidth || 1280;
      renderCanvas.height = video.videoHeight || 720;
      
      const stream = renderCanvas.captureStream(30);

      // Include audio track if available
      if (currentStream && currentStream.getAudioTracks().length > 0) {
        stream.addTrack(currentStream.getAudioTracks()[0]);
      }

      // Continuously draw live stamped frames during video
      let renderLoop = true;
      function loop() {
        if (!renderLoop) return;
        drawStampedFrame(renderCanvas);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        renderLoop = false;
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const link = document.createElement('a');
        link.download = `GPS_Video_${Date.now()}.webm`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      };

      mediaRecorder.start();
      isRecording = true;
      btnShutter.classList.add('recording');
      recordTimer.style.display = 'flex';
      recordSeconds = 0;
      recordInterval = setInterval(() => {
        recordSeconds++;
        const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
        const s = String(recordSeconds % 60).padStart(2, '0');
        timerVal.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnShutter.classList.remove('recording');
        recordTimer.style.display = 'none';
        clearInterval(recordInterval);
      }
    }

    startCamera();
  </script>
</body>
