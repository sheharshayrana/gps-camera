<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GPS Camera Pro</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Viewfinder Container */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: aspect-ratio 0.2s ease;
    }
    video.ratio-4-3 {
      height: auto;
      aspect-ratio: 3/4;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Subtle Horizon Line */
    .level-guide {
      position: absolute;
      width: 60px;
      height: 2px;
      background: rgba(0, 255, 100, 0.45);
      border-radius: 2px;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Action Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 8px) + 8px) 14px 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
    }
    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(18, 22, 28, 0.7);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }
    .top-actions {
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(18, 22, 28, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Stamp Overlay */
    .stamp-container {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 102px;
      z-index: 10;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stamp-container.pos-top {
      bottom: auto;
      top: 64px;
    }
    .stamp-container.pos-compact {
      right: 40px;
    }

    #stamp-card {
      background: rgba(12, 16, 22, 0.86);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .map-box {
      width: 82px;
      height: 82px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #151515;
      border: 1px solid rgba(255,255,255,0.22);
    }
    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .map-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      color: #ff3b30;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .stamp-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      font-size: 11px;
      line-height: 1.34;
      color: #e2e8f0;
      min-width: 0;
    }
    .stamp-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
    }
    .stamp-address {
      color: #cbd5e1;
      outline: none;
      border-bottom: 1px dashed rgba(255,255,255,0.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: fit-content;
      max-width: 100%;
      user-select: text;
    }
    .stamp-note {
      color: #94a3b8;
      outline: none;
      border-bottom: 1px dashed rgba(255,255,255,0.25);
      width: fit-content;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: text;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 20px calc(env(safe-area-inset-bottom, 12px) + 12px) 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
    }
    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
    }
    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.08s ease, background-color 0.08s ease;
    }
    .shutter-btn:active .shutter-inner {
      transform: scale(0.9);
      background: #cbd5e1;
    }

    #hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Camera Sensor Layer -->
    <div id="viewport">
      <video id="camera-feed" playsinline autoplay muted></video>
      <div class="level-guide"></div>
    </div>

    <!-- Top Bar Controls -->
    <div class="top-bar">
      <div class="gps-pill">
        <div class="pulse-dot"></div>
        <span id="gps-status">GPS: Searching...</span>
      </div>
      <div class="top-actions">
        <!-- Flash / Torch Toggle -->
        <button class="icon-btn" id="btn-torch" title="Torch">
          <svg id="svg-torch" viewBox="0 0 24 24">
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
            <path d="M18.57 12.91 21 10h-5.34"></path>
            <path d="M8 8l-5 6h9l-1 8 5-6"></path>
          </svg>
        </button>
        <!-- Flip Camera -->
        <button class="icon-btn" id="btn-flip" title="Flip Camera">
          <svg viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
        </button>
        <!-- Aspect Ratio Toggle -->
        <button class="icon-btn" id="btn-ratio" title="Aspect Ratio">4:3</button>
      </div>
    </div>

    <!-- Live Stamp Overlay (Editable On-Screen) -->
    <div class="stamp-container" id="stamp-container">
      <div id="stamp-card">
        <div class="map-box">
          <img id="map-img" crossorigin="anonymous" alt="Satellite Tile" />
          <div class="map-pin">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff3b30">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
          </div>
        </div>
        <div class="stamp-text">
          <div class="stamp-title" id="txt-city" contenteditable="true" spellcheck="false">Kurukshetra, Haryana, India 🇮🇳</div>
          <div class="stamp-address" id="txt-sub" contenteditable="true" spellcheck="false" title="Tap to name your mill/road">Sector 4, Kurukshetra 136118</div>
          <div id="txt-coords">Lat 0.000000° Long 0.000000°</div>
          <div id="txt-time">--/--/---- --:-- --</div>
          <div class="stamp-note" id="txt-note" contenteditable="true" spellcheck="false">Note : Captured by GPS Camera Pro</div>
        </div>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
      <!-- Toggle Map Style (Satellite vs Street) -->
      <button class="icon-btn" id="btn-map-type" title="Map Style">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>

      <!-- Capture Shutter -->
      <button class="shutter-btn" id="btn-shutter" title="Capture">
        <div class="shutter-inner"></div>
      </button>

      <!-- Move Stamp Position (Bottom -> Top -> Compact) -->
      <button class="icon-btn" id="btn-pos" title="Move Stamp">
        <svg viewBox="0 0 24 24">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
    </div>
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('hidden-canvas');
    const mapImg = document.getElementById('map-img');
    const txtCity = document.getElementById('txt-city');
    const txtSub = document.getElementById('txt-sub');
    const txtCoords = document.getElementById('txt-coords');
    const txtTime = document.getElementById('txt-time');
    const txtNote = document.getElementById('txt-note');
    const gpsStatus = document.getElementById('gps-status');
    const svgTorch = document.getElementById('svg-torch');
    const stampContainer = document.getElementById('stamp-container');

    let currentStream = null;
    let track = null;
    let facingMode = "environment";
    let torchState = false;
    let currentLat = null;
    let currentLng = null;
    let isSatellite = true;
    let isFullRatio = false;
    let stampPosMode = 0; // 0: bottom, 1: top, 2: compact

    // Flags to lock user-edited text across multiple clicks
    let isCustomAddress = false;
    let isCustomNote = false;

    txtSub.addEventListener('input', () => {
      isCustomAddress = true;
    });
    txtNote.addEventListener('input', () => {
      isCustomNote = true;
    });

    const iconZapOn = `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#ffd60a"></polygon>`;
    const iconZapOff = `
      <line x1="2" y1="2" x2="22" y2="22"></line>
      <path d="M12.41 6.75 13 2l-2.43 2.92"></path>
      <path d="M18.57 12.91 21 10h-5.34"></path>
      <path d="M8 8l-5 6h9l-1 8 5-6"></path>
    `;

    // 1. Clock Tracker
    function updateClock() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const day = days[now.getDay()];
      const pad = (n) => String(n).padStart(2, '0');
      const d = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
      
      let hrs = now.getHours();
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      const t = `${pad(hrs)}:${pad(now.getMinutes())} ${ampm} GMT +05:30`;
      
      txtTime.textContent = `${day}, ${d} ${t}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Camera Management
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        track = currentStream.getVideoTracks()[0];

        if (facingMode === "user") {
          video.classList.add('mirrored');
          torchState = false;
          svgTorch.innerHTML = iconZapOff;
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        console.error("Camera startup error", err);
      }
    }

    // Flip Camera
    document.getElementById('btn-flip').addEventListener('click', () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    // Toggle Torch
    document.getElementById('btn-torch').addEventListener('click', async () => {
      if (!track || facingMode === "user") return;
      try {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          torchState = !torchState;
          await track.applyConstraints({ advanced: [{ torch: torchState }] });
          svgTorch.innerHTML = torchState ? iconZapOn : iconZapOff;
        }
      } catch (e) {
        console.warn("Torch failed", e);
      }
    });

    // Toggle Aspect Ratio (4:3 vs Full)
    const btnRatio = document.getElementById('btn-ratio');
    btnRatio.addEventListener('click', () => {
      isFullRatio = !isFullRatio;
      if (isFullRatio) {
        video.classList.remove('ratio-4-3');
        btnRatio.textContent = "Full";
      } else {
        video.classList.add('ratio-4-3');
        btnRatio.textContent = "4:3";
      }
    });

    // Cycle Stamp Position
    document.getElementById('btn-pos').addEventListener('click', () => {
      stampPosMode = (stampPosMode + 1) % 3;
      stampContainer.classList.remove('pos-top', 'pos-compact');
      if (stampPosMode === 1) stampContainer.classList.add('pos-top');
      if (stampPosMode === 2) stampContainer.classList.add('pos-compact');
    });

    // 3. Tile Generation (CORS Enabled)
    function updateMapTile(lat, lng) {
      const zoom = 17;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lng + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);

      mapImg.crossOrigin = "anonymous";
      if (isSatellite) {
        mapImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;
      } else {
        mapImg.src = `https://tile.openstreetmap.org/${zoom}/${xtile}/${ytile}.png`;
      }
    }

    document.getElementById('btn-map-type').addEventListener('click', () => {
      isSatellite = !isSatellite;
      if (currentLat && currentLng) updateMapTile(currentLat, currentLng);
    });

    // 4. Geocoding Engine (Locks if user has typed a name)
    async function resolveDetailedAddress(lat, lng) {
      // If user typed custom name, do not let GPS overwrite it
      if (isCustomAddress) return;

      try {
        const bdc = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
        const bData = await bdc.json();
        if (bData && (bData.locality || bData.principalSubdivision)) {
          const house = bData.localityInfo?.informative?.[0]?.name ? `${bData.localityInfo.informative[0].name}, ` : "";
          const street = bData.locality || "Sector 4";
          const city = bData.city || bData.locality || "Kurukshetra";
          const state = bData.principalSubdivision || "Haryana";
          const country = bData.countryName || "India";
          const post = bData.postcode ? ` ${bData.postcode}` : "";

          txtCity.textContent = `${city}, ${state}, ${country} 🇮🇳`;
          if (!isCustomAddress) {
            txtSub.textContent = `${house}${street}, ${city}${post}`;
          }
          return;
        }
      } catch (e) {}

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        const a = data.address || {};
        const houseNum = a.house_number ? `${a.house_number}, ` : "";
        const road = a.road || a.suburb || a.neighbourhood || "Sector 4";
        const city = a.city || a.town || a.county || "Kurukshetra";
        const state = a.state || "Haryana";
        const country = a.country || "India";
        const postcode = a.postcode ? ` ${a.postcode}` : "";

        txtCity.textContent = `${city}, ${state}, ${country} 🇮🇳`;
        if (!isCustomAddress) {
          txtSub.textContent = `${houseNum}${road}, ${city}${postcode}`.trim();
        }
      } catch (err) {
        txtCity.textContent = `Kurukshetra, Haryana, India 🇮🇳`;
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);

          gpsStatus.textContent = `GPS: ±${acc}m`;
          txtCoords.textContent = `Lat ${currentLat.toFixed(6)}° Long ${currentLng.toFixed(6)}°`;
          updateMapTile(currentLat, currentLng);
          resolveDetailedAddress(currentLat, currentLng);
        },
        () => {
          gpsStatus.textContent = "GPS Unavailable";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    // 5. Stamped Photo Processing & Save
    document.getElementById('btn-shutter').addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // Draw camera sensor frame (handling mirror)
      ctx.save();
      if (facingMode === "user") {
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      ctx.restore();

      // Stamp Placement (Bottom vs Top)
      const stampHeight = Math.round(canvas.height * 0.16);
      const stampY = (stampPosMode === 1) ? 0 : (canvas.height - stampHeight);

      // Translucent Backdrop
      ctx.fillStyle = 'rgba(10, 14, 20, 0.88)';
      ctx.fillRect(0, stampY, canvas.width, stampHeight);

      // Dividing Line
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      const lineY = (stampPosMode === 1) ? stampHeight : stampY;
      ctx.fillRect(0, lineY, canvas.width, 2);

      // Render Map Tile
      const mapPadding = Math.round(stampHeight * 0.1);
      const mapSize = stampHeight - (mapPadding * 2);
      const mapX = mapPadding * 2;
      const mapDrawY = stampY + mapPadding;

      try {
        if (mapImg.complete && mapImg.naturalWidth !== 0) {
          ctx.save();
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(mapX, mapDrawY, mapSize, mapSize, 8);
          } else {
            ctx.rect(mapX, mapDrawY, mapSize, mapSize);
          }
          ctx.clip();
          ctx.drawImage(mapImg, mapX, mapDrawY, mapSize, mapSize);
          ctx.restore();

          // Border & Center Pin
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 2;
          ctx.strokeRect(mapX, mapDrawY, mapSize, mapSize);

          ctx.fillStyle = '#ff3b30';
          ctx.beginPath();
          ctx.arc(mapX + mapSize / 2, mapDrawY + mapSize / 2, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      } catch (e) {
        console.warn("Map frame skipped");
      }

      // Draw Stamped Text (Uses your custom text)
      const textX = mapX + mapSize + (mapPadding * 2);
      let textY = stampY + (stampHeight * 0.22);
      const fontSize = Math.round(stampHeight * 0.13);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${fontSize + 4}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillText(txtCity.textContent, textX, textY);

      ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial`;
      ctx.fillStyle = '#cbd5e1';
      textY += fontSize * 1.35;
      ctx.fillText(txtSub.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtCoords.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillText(txtTime.textContent, textX, textY);

      textY += fontSize * 1.35;
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(txtNote.textContent, textX, textY);

      // Download file directly
      canvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement('a');
        link.download = `GPS_Photo_${Date.now()}.jpg`;
        link.href = URL.createObjectURL(blob);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/jpeg', 0.95);
    });

    startCamera();
  </script>
</body>
</html>
